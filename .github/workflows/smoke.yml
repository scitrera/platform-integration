name: Disposable fixture smoke
on:
  workflow_dispatch:
    inputs:
      image_manifest:
        description: Private images.json path on the configured disposable runner
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: platform-disposable-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: [self-hosted, platform-integration-disposable]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Fresh fixture installation and repeat bootstrap
        env:
          SELECTED_IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/run_compose_smoke.py
          --images "$SELECTED_IMAGE_MANIFEST"
          --directory "/tmp/platform-smoke-$SMOKE_RUN_ID"
          --base-port 18100
