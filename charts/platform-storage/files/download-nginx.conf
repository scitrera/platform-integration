pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 {{- if .Values.uploadProxy.enabled }}
 map $request_uri $artifact_upload_path {
  ~^/uploads(?<signed_upload_path>/.*)$ $signed_upload_path;
  default "";
 }
 upstream artifact_objects { server {{ regexReplaceAll "^https?://" .Values.uploadProxy.endpoint "" }}; }
 {{- end }}
 access_log off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  location = /healthz { return 200; }
  location /blob/ {
   limit_except GET { deny all; }
   proxy_pass http://{{ .Release.Name }}-edge:8090;
   proxy_pass_request_headers off;
   proxy_set_header Host {{ .Release.Name }}-edge;
   proxy_set_header Range $http_range;
   proxy_set_header If-Range $http_if_range;
   proxy_buffering off;
   proxy_read_timeout 120s;
  }
  {{- if .Values.uploadProxy.enabled }}
  location /uploads/ {
   limit_except PUT { deny all; }
   proxy_pass {{ if hasPrefix "https://" .Values.uploadProxy.endpoint }}https{{ else }}http{{ end }}://artifact_objects$artifact_upload_path;
   proxy_pass_request_headers off;
   proxy_set_header Host {{ .Values.uploadProxy.signedHost }};
   proxy_set_header Content-Type $http_content_type;
   proxy_set_header Content-Length $http_content_length;
   {{- if hasPrefix "https://" .Values.uploadProxy.endpoint }}
   proxy_ssl_server_name on;
   proxy_ssl_name {{ (urlParse .Values.uploadProxy.endpoint).hostname }};
   proxy_ssl_verify on;
   proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
   {{- end }}
   client_max_body_size 128m;
   proxy_request_buffering off;
  }
  {{- end }}
  location / { return 404; }
 }
}
