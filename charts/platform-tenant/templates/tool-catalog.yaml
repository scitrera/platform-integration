# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 4 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tool-catalog
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tool-catalog
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tool-catalog
      platform.scitrera.io/trust: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: tool-catalog
        platform.scitrera.io/trust: service
    spec:
      nodeSelector:
{{ toYaml $.Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml $.Values.tolerations | indent 8 }}
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: tool-catalog
        image: {{ required "images.sahara is required" .Values.images.sahara | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "tool-catalog" | default .Values.resources) | indent 10 }}
        env:
        - name: STATEFUL_ROOT
          value: /tmp/state
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: AETHER_GATEWAY
          value: {{ .Release.Name }}-aether:50051
        - name: AETHER_AUTH
          value: none
        - name: AETHER_TLS_ENABLED
          value: 'true'
        - name: AETHER_TLS_CA_CERT
          value: /run/tls/ca.crt
        - name: AETHER_TLS_CLIENT_CERT
          value: /run/tls/tls.crt
        - name: AETHER_TLS_CLIENT_KEY
          value: /run/tls/tls.key
        - name: SCITRERA_TENANT
          value: {{ .Values.tenant }}
        - name: LOGGING_LEVEL
          value: INFO
        - name: AETHER_MAX_RECONNECT_ATTEMPTS
          value: '0'
        - name: AETHER_GATEWAY_ADDR
          value: {{ .Release.Name }}-aether:50051
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /run/tls
          readOnly: true
        command:
        - /usr/local/bin/tool-catalog-service
        envFrom:
        - secretRef:
            name: {{ index .Values.secrets "aether" | quote }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: {{ index .Values.secrets.tls "tool-catalog" | quote }}
{{- end }}
