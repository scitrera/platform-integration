# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 4 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform
      platform.scitrera.io/trust: service
  template:
    metadata:
      annotations:
        checksum/work-profiles: {{ .Values.workProfiles | toJson | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: platform
        platform.scitrera.io/trust: service
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: platform
        image: {{ required "images.backend is required" .Values.images.backend | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "platform" | default .Values.resources) | indent 10 }}
        env:
        - name: SCITRERA_WORK_PROFILES_FILE
          value: /run/work-profiles/profiles.json
        - name: SANDBOX_BLOB_FETCH_BASE_URL
          value: {{ .Values.blobFetchBaseURL | quote }}
        - name: SANDBOX_BLOB_UPLOAD_BASE_URL
          value: {{ .Values.blobUploadBaseURL | quote }}
        - name: STATEFUL_ROOT
          value: /tmp/state
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: AETHER_GATEWAY
          value: {{ .Release.Name }}-aether:50051
        - name: AETHER_AUTH
          value: none
        - name: AETHER_TLS_ENABLED
          value: 'true'
        - name: AETHER_TLS_CA_CERT
          value: /run/tls/ca.crt
        - name: AETHER_TLS_CLIENT_CERT
          value: /run/tls/tls.crt
        - name: AETHER_TLS_CLIENT_KEY
          value: /run/tls/tls.key
        - name: SCITRERA_TENANT
          value: {{ .Values.tenant }}
        - name: LOGGING_LEVEL
          value: INFO
        - name: AETHER_ANON_TLS_CLIENT_CERT
          value: /run/anonymous/tls.crt
        - name: AETHER_ANON_TLS_CLIENT_KEY
          value: /run/anonymous/tls.key
        - name: AETHER_MAX_RECONNECT_ATTEMPTS
          value: '0'
        - name: LLM_GATEWAY_AUTH_MODE
          value: bearer
        - name: LLM_GATEWAY_BASE_URL
          value: http://shared-gateway.{{ .Values.sharedNamespace }}.svc:8080/v1
        - name: LLM_GATEWAY_BEARER_TOKEN_FILE
          value: /run/gateway/token
        - name: WS_ALLOWED_ORIGINS
          value: {{ .Values.publicOrigin }}
        - name: SAHARA_IMAGE
          value: {{ required "images.sahara is required" .Values.images.sahara | quote }}
        - name: SAHARA_CODE_SIDECAR_IMAGE
          value: {{ required "images.code is required" .Values.images.code | quote }}
        volumeMounts:
        - name: work-profiles
          mountPath: /run/work-profiles
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: anonymous
          mountPath: /run/anonymous
          readOnly: true
        - name: gateway-token
          mountPath: /run/gateway
          readOnly: true
        - name: tls
          mountPath: /run/tls
          readOnly: true
        command:
        - python
        - -m
        - x_ws_server
        envFrom:
        - secretRef:
            name: {{ index .Values.secrets "platform" | quote }}
        readinessProbe:
          httpGet: &id001
            port: 8000
            path: /healthz
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet: *id001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: work-profiles
        configMap:
          name: {{ .Release.Name }}-work-profiles
      - name: tmp
        emptyDir: {}
      - name: anonymous
        secret:
          secretName: {{ index .Values.secrets.tls "anonymous" | quote }}
      - name: gateway-token
        secret:
          secretName: {{ .Values.secrets.gatewayToken | quote }}
      - name: tls
        secret:
          secretName: {{ index .Values.secrets.tls "platform-server" | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform
    platform.scitrera.io/trust: service
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform
    platform.scitrera.io/trust: service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
