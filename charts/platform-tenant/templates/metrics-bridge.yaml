{{- if and (ge (int .Values.phase) 4) .Values.metricsBridge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-metrics-bridge
spec:
  replicas: 1
  # Aether admits one metrics::shard0 connection per tenant gateway.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: metrics-bridge}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: metrics-bridge
        platform.scitrera.io/trust: service
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: metrics-bridge
        image: {{ .Values.metricsBridge.image | default .Values.images.backend | quote }}
        command: [python, -m, x_metrics_bridge]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: "0.5", memory: 256Mi}
        env:
{{- range $name, $value := .Values.metricsBridge.environment }}
        - {name: {{ $name }}, value: {{ $value | quote }}}
{{- end }}
        - {name: AETHER_GATEWAY, value: "{{ .Release.Name }}-aether:50051"}
        - {name: AETHER_TLS_ENABLED, value: "true"}
        - {name: AETHER_TLS_CA_CERT, value: /run/tls/ca.crt}
        - {name: AETHER_TLS_CLIENT_CERT, value: /run/tls/tls.crt}
        - {name: AETHER_TLS_CLIENT_KEY, value: /run/tls/tls.key}
        - {name: SCITRERA_TENANT, value: {{ .Values.tenant | quote }}}
        - {name: STATEFUL_ROOT, value: /tmp/state}
        - {name: XDG_CONFIG_HOME, value: /tmp/config}
        - {name: BRIDGE_SERVER_PORT, value: "53002"}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: tls, mountPath: /run/tls, readOnly: true}
        readinessProbe:
          httpGet: {path: /health, port: 53002}
          periodSeconds: 15
        startupProbe:
          httpGet: {path: /health, port: 53002}
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
      - name: tls
        secret: {secretName: {{ .Values.metricsBridge.tlsSecret | quote }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-metrics-openmeter-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: metrics-bridge}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.metricsBridge.namespace | quote }}}
      podSelector:
        matchLabels: {app.kubernetes.io/component: metering-api}
    ports: [{protocol: TCP, port: 8888}]
{{- end }}
