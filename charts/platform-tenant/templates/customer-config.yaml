{{- if .Values.extension.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-customer-config
data:
  review.yaml: {{ .Values.extension.config.review | toYaml | quote }}
{{- range $name, $value := .Values.extension.config.models }}
  model-{{ $name }}.json: {{ $value | toJson | quote }}
{{- end }}
{{- end }}
