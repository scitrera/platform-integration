# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 4 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-skills-{{ .Values.bootstrapRevision }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: skills-{{ .Values.bootstrapRevision }}
    platform.scitrera.io/trust: service
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: skills
        platform.scitrera.io/trust: service
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: skills
        image: {{ required "images.skills is required" .Values.images.skills | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "skills" | default .Values.resources) | indent 10 }}
        env:
        - name: SKILL_SEED_PRINCIPAL_TYPE
          value: service
        - name: SKILL_SEED_WORKSPACE
          value: _global
        - name: STATEFUL_ROOT
          value: /tmp/state
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: AETHER_GATEWAY
          value: {{ .Release.Name }}-aether:50051
        - name: AETHER_AUTH
          value: none
        - name: AETHER_TLS_ENABLED
          value: 'true'
        - name: AETHER_TLS_CA_CERT
          value: /run/tls/ca.crt
        - name: AETHER_TLS_CLIENT_CERT
          value: /run/tls/tls.crt
        - name: AETHER_TLS_CLIENT_KEY
          value: /run/tls/tls.key
        - name: SCITRERA_TENANT
          value: {{ .Values.tenant }}
        - name: LOGGING_LEVEL
          value: INFO
        - name: AETHER_MAX_RECONNECT_ATTEMPTS
          value: '0'
        - name: AETHER_GATEWAY_ADDR
          value: {{ .Release.Name }}-aether:50051
        - name: TENANT_ID
          value: {{ .Values.tenant }}
        - name: AETHER_MGMT_TLS_CLIENT_CERT
          value: /run/management/tls.crt
        - name: AETHER_MGMT_TLS_CLIENT_KEY
          value: /run/management/tls.key
        - name: AETHER_MGMT_TLS_CA_CERT
          value: /run/management/ca.crt
        - name: AETHER_MGMT_SPECIFIER
          value: bootstrap
        - name: MINT_ORCH_IMPL
          value: default
        - name: MINT_ORCH_SPEC
          value: bootstrap
        - name: ADMIN_EMAIL
          value: {{ .Values.adminEmail }}
        - name: SEED_DEV_ADMIN
          value: {{ .Values.seedDevelopmentAdmin | toString | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: bootstrap
          mountPath: /integration
          readOnly: true
        - name: management
          mountPath: /run/management
          readOnly: true
        - name: tls
          mountPath: /run/tls
          readOnly: true
        command:
        - python
        - -m
        - x_seed_skills
      volumes:
      - name: tmp
        emptyDir: {}
      - name: bootstrap
        configMap:
          name: {{ .Release.Name }}-bootstrap
      - name: management
        secret:
          secretName: {{ index .Values.secrets.tls "management" | quote }}
      - name: tls
        secret:
          secretName: {{ index .Values.secrets.tls "orchestrator" | quote }}
      restartPolicy: Never
{{- end }}
