# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 4 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bridge
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: bridge
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: bridge
      platform.scitrera.io/trust: service
  template:
    metadata:
      annotations:
        checksum/work-profiles: {{ .Values.workProfiles | toJson | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bridge
        platform.scitrera.io/trust: service
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: bridge
        image: {{ required "images.backend is required" .Values.images.backend | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "bridge" | default .Values.resources) | indent 10 }}
        env:
        - name: LLM_GATEWAY_AUTH_MODE
          value: bearer
        - name: LLM_GATEWAY_BASE_URL
          value: http://shared-gateway.{{ .Values.sharedNamespace }}.svc:8080/v1
        - name: LLM_GATEWAY_BEARER_TOKEN_FILE
          value: /run/gateway/token
        - name: SCITRERA_WORK_PROFILES_FILE
          value: /run/work-profiles/profiles.json
        - name: STATEFUL_ROOT
          value: /tmp/state
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: AETHER_GATEWAY
          value: {{ .Release.Name }}-aether:50051
        - name: AETHER_AUTH
          value: none
        - name: AETHER_TLS_ENABLED
          value: 'true'
        - name: AETHER_TLS_CA_CERT
          value: /run/tls/ca.crt
        - name: AETHER_TLS_CLIENT_CERT
          value: /run/tls/tls.crt
        - name: AETHER_TLS_CLIENT_KEY
          value: /run/tls/tls.key
        - name: SCITRERA_TENANT
          value: {{ .Values.tenant }}
        - name: LOGGING_LEVEL
          value: INFO
        - name: AETHER_MAX_RECONNECT_ATTEMPTS
          value: '0'
        - name: AETHER_GATEWAY_ADDR
          value: {{ .Release.Name }}-aether:50051
        - name: PLATFORM_BRIDGE_SEMANTIC_TOOL_SEARCH
          value: 'false'
        volumeMounts:
        - name: gateway-token
          mountPath: /run/gateway
          readOnly: true
        - name: work-profiles
          mountPath: /run/work-profiles
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /run/tls
          readOnly: true
        command:
        - python
        - -m
        - x_platform_bridge
      volumes:
      - name: gateway-token
        secret:
          secretName: {{ .Values.secrets.gatewayToken | quote }}
      - name: work-profiles
        configMap:
          name: {{ .Release.Name }}-work-profiles
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: {{ index .Values.secrets.tls "platform-bridge" | quote }}
{{- end }}
