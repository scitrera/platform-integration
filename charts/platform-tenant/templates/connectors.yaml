# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 2 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-connectors
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: connectors
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: connectors
      platform.scitrera.io/trust: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: connectors
        platform.scitrera.io/trust: service
    spec:
      nodeSelector:
{{ toYaml $.Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml $.Values.tolerations | indent 8 }}
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: connectors
        image: {{ required "images.connectors is required" .Values.images.connectors | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "connectors" | default .Values.resources) | indent 10 }}
        env:
        - name: DC_BLOBGW_FETCH_BASE_URL
          value: {{ .Values.blobFetchBaseURL | quote }}
        - name: DC_BLOBGW_UPLOAD_INTERNAL_URL
          value: {{ .Values.blobUploadBaseURL | quote }}
        - name: STATEFUL_ROOT
          value: /tmp/state
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: AETHER_GATEWAY
          value: {{ .Release.Name }}-aether:50051
        - name: AETHER_AUTH
          value: none
        - name: AETHER_TLS_ENABLED
          value: 'true'
        - name: AETHER_TLS_CA_CERT
          value: /run/tls/ca.crt
        - name: AETHER_TLS_CLIENT_CERT
          value: /run/tls/tls.crt
        - name: AETHER_TLS_CLIENT_KEY
          value: /run/tls/tls.key
        - name: SCITRERA_TENANT
          value: {{ .Values.tenant }}
        - name: LOGGING_LEVEL
          value: INFO
        - name: AETHER_MAX_RECONNECT_ATTEMPTS
          value: '0'
        - name: AETHER_GATEWAY_ADDR
          value: {{ .Release.Name }}-aether:50051
        - name: DC_HOST
          value: 0.0.0.0
        - name: DC_PORT
          value: '8100'
        - name: DC_SERVICE_SPECIFIER
          value: {{ .Values.tenant }}
        - name: DC_VFS_AUTHORIZATION_MODE
          value: aether
        - name: DC_BLOB_TYPE
          value: blobgw
        - name: DC_BLOBGW_URL
          value: http://{{ .Values.storageRelease }}-blobgw.{{ .Values.storageNamespace }}.svc:8080
        - name: DC_BLOBGW_EDGE_URL
          value: http://{{ .Values.storageRelease }}-edge.{{ .Values.storageNamespace }}.svc:8090
        - name: DC_BLOBGW_DOWNLOAD_REQUIRE_AUTH
          value: 'true'
        - name: DC_BLOBGW_DOMAIN
          value: {{ .Values.tenant }}
        - name: MEMORYLAYER_OTEL_ENABLED
          value: 'false'
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /run/tls
          readOnly: true
        envFrom:
        - secretRef:
            name: {{ index .Values.secrets "connectors" | quote }}
        readinessProbe:
          httpGet: &id001
            port: 8100
            path: /healthz
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet: *id001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: {{ index .Values.secrets.tls "data-connectors" | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-connectors
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: connectors
    platform.scitrera.io/trust: service
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: connectors
    platform.scitrera.io/trust: service
  ports:
  - name: http
    port: 8100
    targetPort: 8100
