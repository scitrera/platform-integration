{{- if .Values.components.web }}
# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      resolver {{ .Values.dnsResolver }} valid=5s ipv6=off;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      access_log off;
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        location = /healthz { return 200 'ok'; }
        location ^~ /api/auth/ {
          proxy_pass {{ $.Values.authEndpoint.external | default (printf "http://%s-auth:8081" $.Release.Name) }}/;
          proxy_set_header Host $http_host;
          proxy_set_header Origin $http_origin;
        }
        location ^~ /auth/login/ { set $args "next=/api/auth/"; proxy_pass {{ $.Values.authEndpoint.external | default (printf "http://%s-auth:8081" $.Release.Name) }}; proxy_set_header Host $http_host; }
        location ^~ /auth/callback/ { proxy_pass {{ $.Values.authEndpoint.external | default (printf "http://%s-auth:8081" $.Release.Name) }}; proxy_set_header Host $http_host; }
        location ^~ /auth/ { return 404; }
        location = /source.tar.gz { try_files $uri =404; }
        location ^~ /assets/ { try_files $uri =404; }
    {{ range .Values.tenants }}
    {{ if ne .toolsWssEnabled false }}
        location = /{{ .id }}/tools/v1/connect {
          proxy_pass_request_headers off;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Origin $http_origin;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header X-API-Key $http_x_api_key;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
          proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
          proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
          set $tools_{{ .id }} http://{{ .release }}-tools.{{ .namespace }}.svc.{{ $.Values.clusterDomain }}:8090;
          rewrite ^/{{ .id }}/tools/(.*)$ /$1 break;
          proxy_pass $tools_{{ .id }};
        }
    {{ else }}
        location = /{{ .id }}/tools/v1/connect { return 404; }
    {{ end }}
        location = /_verify_{{ .id }} {
          internal;
          # Upload routes enforce their own limit; auth never forwards a body.
          client_max_body_size 0;
          proxy_pass {{ $.Values.authEndpoint.verify | default (printf "http://%s-auth:8080/auth/verify" $.Release.Name) }}?workspace_id=auth-app&tenant_id={{ .id }};
          proxy_pass_request_body off;
          proxy_pass_request_headers off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header Authorization $http_authorization;
        }
        location ~ ^/{{ .id }}/(rfe1-ws(?:/v2)?/?)$ {
          auth_request /_verify_{{ .id }};
          auth_request_set $user_{{ .id }} $upstream_http_x_scitrera_user;
          auth_request_set $name_{{ .id }} $upstream_http_x_scitrera_name;
          auth_request_set $tenants_{{ .id }} $upstream_http_x_scitrera_tenants;
          auth_request_set $default_{{ .id }} $upstream_http_x_scitrera_default_tenant;
          auth_request_set $type_{{ .id }} $upstream_http_x_auth_principal_type;
          proxy_pass_request_headers off;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Origin $http_origin;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
          proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
          proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header X-Scitrera-User $user_{{ .id }};
          proxy_set_header X-Scitrera-Name $name_{{ .id }};
          proxy_set_header X-Scitrera-Tenants $tenants_{{ .id }};
          proxy_set_header X-Scitrera-Default-Tenant $default_{{ .id }};
          proxy_set_header X-Auth-User-ID $user_{{ .id }};
          proxy_set_header X-Auth-Tenant-ID {{ .id }};
          proxy_set_header X-Auth-Principal-Type $type_{{ .id }};
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
          set $platform_{{ .id }} http://{{ .release }}-platform.{{ .namespace }}.svc.{{ $.Values.clusterDomain }}:8000;
          rewrite ^/{{ .id }}/(.*)$ /$1 break;
          proxy_pass $platform_{{ .id }};
        }
    {{ if $.Values.uploadProxy.enabled }}
        location ^~ /storage/{{ .id }}/uploads/ {
          auth_request /_verify_{{ .id }};
          limit_except PUT { deny all; }
          proxy_pass_request_headers off;
          proxy_set_header Host {{ required "uploadProxy.signedHost is required" $.Values.uploadProxy.signedHost }};
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header Content-Length $http_content_length;
          client_max_body_size 512m;
          proxy_request_buffering off;
          set $upload_{{ .id }} {{ required "uploadProxy.endpoint is required" $.Values.uploadProxy.endpoint }};
          rewrite ^/storage/{{ .id }}/uploads/(.*)$ /$1 break;
          proxy_pass $upload_{{ .id }};
        }
    {{ end }}
        location ~ ^/storage/{{ .id }}/(blob|staged|finalize)/ {
          auth_request /_verify_{{ .id }};
          auth_request_set $storage_user_{{ .id }} $upstream_http_x_scitrera_user;
          proxy_pass_request_headers off;
          proxy_set_header X-Auth-Tenant-ID {{ .id }};
          proxy_set_header X-Scitrera-User $storage_user_{{ .id }};
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header Range $http_range;
          proxy_set_header If-Range $http_if_range;
          proxy_set_header If-None-Match $http_if_none_match;
          proxy_set_header Content-Length $http_content_length;
          client_max_body_size 512m;
          proxy_request_buffering off;
          proxy_buffering off;
          set $storage_{{ .id }} {{ $.Values.storageEdgeEndpoint }};
          rewrite ^/storage/{{ .id }}/(.*)$ /$1 break;
          proxy_pass $storage_{{ .id }};
        }
    {{ end }}
        location ~ /tools/ { return 404; }
        location ~ /rfe1-ws { return 404; }
        location /storage/ { return 404; }
        location ~* \.(js|css|map|png|jpg|svg|ico|woff2?|gz)$ { try_files $uri =404; }
        location ^~ /api/ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
      }
    }

{{- end }}
