# SPDX-License-Identifier: AGPL-3.0-only
{{- if and (ge (int .Values.phase) 2) .Values.components.web .Values.ingress.enabled .Values.ingress.connectionHostnames }}
{{- if or (not .Values.ingress.hostAuth.enabled) .Values.ingress.createGateway }}
{{- fail "connection aliases require hostAuth and an existing shared Gateway" }}
{{- end }}
{{- if ne .Values.tenant .Values.ingress.hostAuth.tenant }}
{{- fail "connection alias tenant must match its authentication scope" }}
{{- end }}
{{- range .Values.ingress.connectionHostnames }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$" .) }}
{{- fail "connection aliases require exact DNS hostnames" }}
{{- end }}
{{- end }}
{{- if empty .Values.ingress.connectionOrigins }}
{{- fail "connection aliases require explicit trusted browser origins" }}
{{- end }}
{{- range .Values.ingress.connectionOrigins }}
{{- if not (regexMatch "^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$" .) }}
{{- fail "connection aliases require exact HTTPS browser origins" }}
{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-connections
spec:
  parentRefs:
  - name: {{ required "connection aliases require ingress.parentName" .Values.ingress.parentName }}
    namespace: {{ required "connection aliases require ingress.parentNamespace" .Values.ingress.parentNamespace }}
    sectionName: {{ .Values.ingress.sectionName }}
  hostnames:
{{ toYaml .Values.ingress.connectionHostnames | indent 2 }}
  rules:
  - matches:
    - path: {type: PathPrefix, value: {{ printf "/%s/rfe1-ws" .Values.tenant | quote }}}
    timeouts: {request: 3600s, backendRequest: 3600s}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove: [X-Scitrera-User, X-Scitrera-Name, X-Scitrera-Tenants, X-Scitrera-Default-Tenant, X-Auth-User-ID, X-Auth-Tenant-ID, X-Auth-Principal-Type]
    backendRefs:
    - name: {{ .Release.Name }}-web
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-connections-auth
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Release.Name }}-connections
  cors:
    allowOrigins:
{{ toYaml .Values.ingress.connectionOrigins | indent 4 }}
    allowCredentials: true
    allowMethods: [GET, POST, OPTIONS]
    allowHeaders: [Accept, Content-Type]
    maxAge: 300s
  extAuth:
    failOpen: false
    http:
      backendRefs:
      - name: {{ .Release.Name }}-auth-gate
        port: 8080
      path: /authorize
    headersToExtAuth: [Cookie, Authorization, Accept, Sec-Fetch-Dest, Upgrade]
{{- end }}
