{{- if and .Values.components.auth (not .Values.authSession.sentinel.addresses) }}
# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sessions
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sessions
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sessions
      platform.scitrera.io/trust: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sessions
        platform.scitrera.io/trust: service
    spec:
      nodeSelector:
{{ toYaml $.Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml $.Values.tolerations | indent 8 }}
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: sessions
        image: {{ required "images.valkey is required" .Values.images.valkey | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "sessions" | default .Values.resources) | indent 10 }}
        env: []
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /data
        command:
        - valkey-server
        args:
        - --appendonly
        - 'yes'
        - --appendfsync
        - always
        - --maxmemory-policy
        - noeviction
        readinessProbe:
          exec: &id001
            command:
            - valkey-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          exec: *id001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: {{ index .Values.existingClaims "sessions" | default (printf "%s-sessions-state" .Release.Name) | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sessions
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sessions
    platform.scitrera.io/trust: service
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sessions
    platform.scitrera.io/trust: service
  ports:
  - name: redis
    port: 6379
    targetPort: 6379

{{- end }}
