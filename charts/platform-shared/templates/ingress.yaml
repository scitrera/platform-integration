# SPDX-License-Identifier: AGPL-3.0-only
{{ if ge (int .Values.phase) 2 }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-public
spec:
  gatewayClassName: {{ .Values.gatewayClass }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-web
spec:
  parentRefs:
    - name: {{ .Release.Name }}-public
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: {{ .Release.Name }}-web
          port: 8080
{{ end }}
