# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 1 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-auth-migrate-{{ .Values.bootstrapRevision }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: auth-migrate-{{ .Values.bootstrapRevision }}
    platform.scitrera.io/trust: service
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth-migrate
        platform.scitrera.io/trust: service
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: auth-migrate
        image: {{ required "images.auth is required" .Values.images.auth | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "auth-migrate" | default .Values.resources) | indent 10 }}
        env: []
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        args:
        - migrate
        envFrom:
        - secretRef:
            name: {{ index .Values.secrets "auth" | quote }}
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
{{- end }}
