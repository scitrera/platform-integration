# SPDX-License-Identifier: AGPL-3.0-only
{{- if ge (int .Values.phase) 2 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    platform.scitrera.io/trust: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
      platform.scitrera.io/trust: service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
        platform.scitrera.io/trust: service
    spec:
      serviceAccountName: {{ .Release.Name }}-gateway
      automountServiceAccountToken: {{ .Values.modelCatalog.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: private-files
        image: {{ required "images.web is required" .Values.images.web | quote }}
        command: ["/bin/sh", "-ec"]
        args:
        - mkdir -p /output/private; chmod 700 /output/private; cp /input/* /output/private/; chmod 400 /output/private/*
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: files-source
          mountPath: /input
          readOnly: true
        - name: files
          mountPath: /output
      containers:
      - name: gateway
        image: {{ required "images.sparkroute is required" .Values.images.sparkroute | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
{{ toYaml (index .Values.roleResources "gateway" | default .Values.resources) | indent 10 }}
        env:
{{- if .Values.modelCatalog.enabled }}
        - name: SPARKROUTE_MODEL_CATALOG_KIND
          value: aether
        - name: SPARKROUTE_MODEL_CATALOG_SOURCE_ID
          value: tenant-aether
        - name: SPARKROUTE_MODEL_CATALOG_AETHER_ADDRESS_TEMPLATE
          value: {{ .Values.modelCatalog.addressTemplate | quote }}
        - name: SPARKROUTE_MODEL_CATALOG_AETHER_SERVER_NAME_TEMPLATE
          value: {{ .Values.modelCatalog.serverNameTemplate | quote }}
        - name: SPARKROUTE_MODEL_CATALOG_AETHER_CREDENTIAL_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: SPARKROUTE_MODEL_CATALOG_AETHER_REPLICA_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: SPARKROUTE_MODEL_CATALOG_ALLOWED_PROVIDER_HOSTS
          value: {{ required "modelCatalog.allowedProviderHosts is required" (join "," .Values.modelCatalog.allowedProviderHosts) | quote }}
        - name: SPARKROUTE_MODEL_CATALOG_PROVIDER_ALLOW_HTTP
          value: {{ .Values.modelCatalog.allowHTTP | quote }}
{{- end }}
        - name: SPARKROUTE_CONFIG
          value: /run/gateway/config.json
        - name: SPARKROUTE_DATA_ADDRESS
          value: :8080
        - name: SPARKROUTE_ADMIN_ADDRESS
          value: 127.0.0.1:8081
        - name: SPARKROUTE_OPERATIONS_ADDRESS
          value: 127.0.0.1:9090
        - name: SPARKROUTE_POSTGRES_AUTO_MIGRATE
          value: 'false'
        - name: SPARKROUTE_RUNTIME_POSTGRES_AUTO_MIGRATE
          value: 'false'
        - name: SPARKROUTE_CALLER_AUTH_MODE
          value: bearer
        - name: SPARKROUTE_CALLER_AUTH_CONFIG_REF
          value: file:///run/gateway/callers.json
        - name: SPARKROUTE_CALLER_AUTH_HEADERS
          value: "{\n  \"tenant\": [\"X-Scitrera-Tenant\"],\n  \"user\": [\"X-Scitrera-User\"],\n  \"source\": [\"X-Scitrera-Source\"\
            ],\n  \"workspace\": [\"X-Scitrera-Workspace\"],\n  \"thread_id\": [\"X-Scitrera-Thread-Id\"],\n  \"task_id\"\
            : [\"X-Scitrera-Task-Id\"],\n  \"experiment\": [\"X-Scitrera-Experiment\"],\n  \"session\": [\"X-Scitrera-Session\"\
            ],\n  \"mlflow_experiment_id\": [\"X-MLflow-Experiment-Id\"]\n}"
        - name: SPARKROUTE_CREDENTIAL_FILE_ROOTS
          value: /run/gateway
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: files
          mountPath: /run/gateway
          subPath: private
          readOnly: true
        envFrom:
        - secretRef:
            name: {{ index .Values.secrets "gateway" | quote }}
        readinessProbe:
          tcpSocket: &id001
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir: {}
      - name: files
        emptyDir:
          medium: Memory
      - name: files-source
        secret:
          secretName: {{ .Values.secrets.gatewayFiles | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    platform.scitrera.io/trust: service
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    platform.scitrera.io/trust: service
  ports:
  - name: data
    port: 8080
    targetPort: 8080
