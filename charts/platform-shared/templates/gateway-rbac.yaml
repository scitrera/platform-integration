{{- if .Values.components.gateway }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-gateway
automountServiceAccountToken: false
{{- if .Values.modelCatalog.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-catalog-credentials
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames:
{{ toYaml (required "modelCatalog.credentialSecretNames is required" .Values.modelCatalog.credentialSecretNames) | indent 2 }}
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-catalog-credentials
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-catalog-credentials
{{- end }}

{{- end }}
