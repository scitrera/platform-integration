# SPDX-License-Identifier: AGPL-3.0-only
{{- if not .Values.development }}
{{- range $name, $image := .Values.images }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) }}
{{- fail (printf "production images.%s must use a registry manifest digest" $name) }}
{{- end }}{{- end }}{{- end }}

{{- if ne (empty .Values.authSession.sentinel.master) (empty .Values.authSession.sentinel.addresses) }}
{{- fail "authSession.sentinel requires both master and addresses" }}
{{- end }}

{{- if .Values.components.auth }}
{{- range $origin := (include "platform-shared.authOrigins" . | fromJsonArray) }}
{{- if not (regexMatch "^https?://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$" $origin) }}
{{- fail "authSession.allowedOrigins and publicOrigin require exact HTTP(S) origins without wildcards, paths or credentials" }}
{{- end }}
{{- if and (not $.Values.development) (not (hasPrefix "https://" $origin)) }}
{{- fail "production auth session origins must use HTTPS" }}
{{- end }}
{{- end }}
{{- range $host := (include "platform-shared.authHostnames" . | fromJsonArray) }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$" $host) }}
{{- fail "authIngress.additionalHostnames and adminOrigin require exact DNS hostnames" }}
{{- end }}
{{- end }}
{{- end }}

{{- range $origin := .Values.authSession.genericAppOrigins }}
{{- if not (has $origin (include "platform-shared.authOrigins" $ | fromJsonArray)) }}
{{- fail "authSession.genericAppOrigins must belong to the trusted auth origins" }}
{{- end }}
{{- end }}
