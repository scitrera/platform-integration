# SPDX-License-Identifier: AGPL-3.0-only
{{- if and .Values.components.auth .Values.authIngress.enabled (ge (int .Values.phase) 2) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-auth-public
spec:
  parentRefs:
  - name: {{ required "authIngress.parentName required" .Values.authIngress.parentName }}
    namespace: {{ required "authIngress.parentNamespace required" .Values.authIngress.parentNamespace }}
    sectionName: {{ .Values.authIngress.sectionName }}
  hostnames:
{{ include "platform-shared.authHostnames" . | fromJsonArray | toYaml | indent 2 }}
  rules:
  - matches: [{path: {type: PathPrefix, value: /}}]
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove: [X-Scitrera-User, X-Scitrera-Name, X-Scitrera-Tenants, X-Scitrera-Default-Tenant, X-Auth-User-ID, X-Auth-Tenant-ID, X-Auth-Principal-Type]
    backendRefs:
    - name: {{ .Release.Name }}-auth
      port: 8081
---
# Keep credentialed CORS on the two read-only session probes, not OAuth/admin APIs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-auth-status
spec:
  parentRefs:
  - name: {{ .Values.authIngress.parentName }}
    namespace: {{ .Values.authIngress.parentNamespace }}
    sectionName: {{ .Values.authIngress.sectionName }}
  hostnames:
{{ include "platform-shared.authHostnames" . | fromJsonArray | toYaml | indent 2 }}
  rules:
  - matches:
    - path: {type: Exact, value: /checkz}
    - path: {type: Exact, value: /auth/checkz}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove: [X-Scitrera-User, X-Scitrera-Name, X-Scitrera-Tenants, X-Scitrera-Default-Tenant, X-Auth-User-ID, X-Auth-Tenant-ID, X-Auth-Principal-Type]
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set: [{name: Cache-Control, value: no-store}]
        add: [{name: Vary, value: Origin}]
    backendRefs:
    - name: {{ .Release.Name }}-auth
      port: 8081
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-auth-status-cors
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Release.Name }}-auth-status
  cors:
    allowOrigins:
{{ include "platform-shared.authOrigins" . | fromJsonArray | toYaml | indent 4 }}
    allowCredentials: true
    allowMethods: [GET, HEAD, OPTIONS]
    allowHeaders: [Accept, Content-Type]
    maxAge: 300s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-public-auth-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.authIngress.parentNamespace | quote }}}
    ports: [{protocol: TCP, port: 8081}]
{{- end }}
