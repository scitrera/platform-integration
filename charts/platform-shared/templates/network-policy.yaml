# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-default-deny'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-dns'
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-services'
spec:
  podSelector:
    matchLabels: &id001
      platform.scitrera.io/trust: service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels: *id001
  egress:
  - to:
    - podSelector:
        matchLabels: *id001
    - podSelector:
        matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-database'
spec:
  podSelector:
    matchExpressions:
    - key: cnpg.io/cluster
      operator: Exists
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          platform.scitrera.io/trust: service
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-envoy-ingress'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    ports:
    - protocol: TCP
      port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-model-data'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          platform.scitrera.io/tenant: 'true'
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-auth-oauth'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: auth
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-web-tenants'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          platform.scitrera.io/tenant: 'true'
      podSelector:
        matchLabels:
          app.kubernetes.io/component: platform
    ports:
    - protocol: TCP
      port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}-web-storage'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{ .Values.storageNamespace }}'
    ports:
    - protocol: TCP
      port: 8090
    - protocol: TCP
      port: 9000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-tenant-catalog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          platform.scitrera.io/tenant: 'true'
      podSelector:
        matchLabels:
          app.kubernetes.io/component: aether
    ports:
    - {protocol: TCP, port: 50051}

{{- if .Values.modelCatalog.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-catalog-kubernetes-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes: [Egress]
  egress:
{{- range .Values.modelCatalog.apiEgress }}
  - to:
    - ipBlock:
        cidr: {{ .cidr | quote }}
    ports:
    - {protocol: TCP, port: {{ .port }}}
{{- end }}
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web-tools
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: web}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {platform.scitrera.io/tenant: "true"}
      podSelector:
        matchLabels: {app.kubernetes.io/component: tools}
    ports: [{protocol: TCP, port: 8090}]
