pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 map $request_uri $artifact_upload_path {
  ~^/uploads(?<signed_upload_path>/.*)$ $signed_upload_path;
  default "";
 }
 upstream artifact_objects { server objects:9000; }
 access_log off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  location = /healthz { return 200; }
  # Canonical page downloads use a short-lived, tenant-bound capability.
  # No public port, caller-selected host, filesystem path or auth forwarding.
  location ~ "^/blob/source-pages/(?<source_tenant>[a-z0-9][a-z0-9-]{0,62})/(?<source_ticket>[A-Za-z0-9_-]+[.][a-f0-9]{64})$" {
   # Upstream failures must not log the request URI containing a capability.
   error_log /dev/stderr crit;
   limit_except GET { deny all; }
   resolver 127.0.0.11 valid=10s ipv6=off;
   proxy_pass http://memorylayer-$source_tenant:8000/v1/documents/source-files/download;
   proxy_pass_request_headers off;
   proxy_set_header Host memorylayer-$source_tenant;
   proxy_set_header Authorization "Bearer $source_ticket";
   proxy_buffering off;
   proxy_read_timeout 120s;
  }
  location /blob/ {
   limit_except GET { deny all; }
   # Refresh Docker DNS after an edge container is recreated.
   resolver 127.0.0.11 valid=10s ipv6=off;
   set $artifact_edge http://storage-edge:8090;
   proxy_pass $artifact_edge;
   error_log /dev/stderr crit;
   proxy_pass_request_headers off;
   proxy_set_header Host storage-edge;
   proxy_set_header Range $http_range;
   proxy_set_header If-Range $http_if_range;
   proxy_buffering off;
   proxy_read_timeout 120s;
  }
  location /uploads/ {
   limit_except PUT { deny all; }
   proxy_pass http://artifact_objects$artifact_upload_path;
   proxy_pass_request_headers off;
   proxy_set_header Host objects:9000;
   proxy_set_header Content-Type $http_content_type;
   proxy_set_header Content-Length $http_content_length;
   client_max_body_size 512m;
   proxy_request_buffering off;
  }
  location / { return 404; }
 }
}
