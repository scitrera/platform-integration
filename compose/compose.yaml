      AETHER_MGMT_TLS_CLIENT_CERT: /run/management/tls.crt
      AETHER_MGMT_TLS_CLIENT_KEY: /run/management/tls.key
      AETHER_MGMT_TLS_CA_CERT: /run/management/ca.crt
      AETHER_MGMT_SPECIFIER: bootstrap
      MINT_ORCH_IMPL: default
