  storage-download:
    image: ${WEB_IMAGE:?Run build.py}
    user: 1000:1000
    entrypoint:
    - nginx
    - -g
    - daemon off;
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - ./config/download-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - storage-api
    - storage
    - tenant-alpha
    - tenant-beta
    depends_on:
      storage-edge:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
