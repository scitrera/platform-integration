name: ${COMPOSE_PROJECT_NAME:-platform-integration}
services:
  mt-postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${MT_PASSWORD:?Run configure.py}
    volumes:
    - mt-data:/var/lib/postgresql/data
    networks:
    - identity
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U auth -d auth
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  sessions:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command:
    - valkey-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - always
    - --maxmemory-policy
    - noeviction
    volumes:
    - sessions:/data
    networks:
    - identity
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli ping
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  auth-migrate:
    image: ${AUTH_IMAGE:?Run build.py}
    command:
    - migrate
    networks:
    - identity
    environment:
      SCITRERA_MT_DB_URL: postgres://auth:${MT_PASSWORD}@mt-postgres:5432/auth?sslmode=disable
    depends_on:
      mt-postgres:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  auth:
    image: ${AUTH_IMAGE:?Run build.py}
    user: ${LOCAL_UID}:${LOCAL_GID}
    networks:
    - identity
    - gateway
    ports:
    - 127.0.0.1:${AUTH_ADMIN_PORT:-18082}:8082
    volumes:
    - ../.local/operators.json:/run/auth/operators.json:ro
    env_file:
    - path: ../.local/oauth.env
      required: false
    environment:
      SCITRERA_MT_DB_URL: postgres://auth:${MT_PASSWORD}@mt-postgres:5432/auth?sslmode=disable
      AUTH_PROXY_MODE: verify
      AUTH_PROXY_LISTEN_ADDR: :8080
      AUTH_PROXY_TOKEN_HMAC_KEY: ${AUTH_HMAC}
      AUTH_PROXY_REDIS_ADDR: sessions:6379
      AUTH_PROXY_SESSION_STORE: redis
      AUTH_PROXY_SESSION_REDIS_ADDR: sessions:6379
      SCITRERA_AUTH_EXTERNAL_ADDR: :8081
      SCITRERA_AUTH_ADMIN_ADDR: :8082
      SCITRERA_AUTH_ADMIN_ORIGIN: http://127.0.0.1:${AUTH_ADMIN_PORT:-18082}
      SCITRERA_AUTH_ADMIN_TOKEN_FILE: /run/auth/operators.json
      SCITRERA_AUTH_POST_LOGIN_TARGET: ${PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-18080}}
      SCITRERA_AUTH_ALLOWED_REDIRECT_HOSTS: ${PUBLIC_HOSTNAME:-127.0.0.1}
      SCITRERA_AUTH_CHECKZ_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-18080}}
      AUTH_PROXY_SESSION_COOKIE_SECURE: 'false'
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      sessions:
        condition: service_healthy
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  web:
    image: ${WEB_IMAGE:?Run build.py}
    ports:
    - ${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080
    volumes:
    - ../.local/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - gateway
    - storage-api
    - storage
    depends_on:
      auth:
        condition: service_started
      platform-alpha:
        condition: service_healthy
      platform-beta:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  aether-alpha:
    image: ${AETHER_IMAGE:?Run build.py}
    entrypoint:
    - aetherlite
    command:
    - -config
    - /etc/aether/config.yaml
    - -data-dir
    - /data
    environment:
      AETHER_TENANT_ID: alpha
      AETHER_TOKEN_HMAC_KEY: ${AETHER_HMAC_ALPHA}
      AETHER_ADMIN_API_KEY: ${AETHER_ADMIN_ALPHA}
      AETHERLITE_AUTH_VERIFY_LISTEN: :8082
    volumes:
    - aether-alpha:/data
    - ../.local/alpha/aether.yaml:/etc/aether/config.yaml:ro
    - ../.local/alpha/tls/server:/etc/aether/tls:ro
    networks:
      tenant-alpha:
        aliases:
        - aether-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    depends_on:
      aether-init-alpha:
        condition: service_completed_successfully
  acl-alpha:
    image: ${BACKEND_IMAGE:?Run build.py}
    command:
    - python
    - -m
    - x_acl_seed
    environment:
      AETHER_GATEWAY: aether-alpha:50051
      AETHER_AUTH: none
      AETHER_TLS_ENABLED: 'true'
      AETHER_TLS_CA_CERT: /run/tls/ca.crt
      AETHER_TLS_CLIENT_CERT: /run/tls/tls.crt
      AETHER_TLS_CLIENT_KEY: /run/tls/tls.key
      SCITRERA_TENANT: alpha
      LOGGING_LEVEL: INFO
      TENANT_ID: alpha
      ACL_SEED_PHASE: acl
      MINT_ORCH_IMPL: default
      MINT_ORCH_SPEC: bootstrap
      ACL_TRUSTED_SERVICE_IMPLEMENTATIONS: platform-server,platform-bridge,memorylayer,data-connectors,tool-catalog,sandbox-provider,scitrera-management-plane
      ACL_READ_ONLY_KV_SERVICES: '{"sparkroute-modelcatalog": ["sparkroute/modelcatalog/v1/models/*"]}'
    volumes:
    - ../.local/alpha/tls/orchestrator:/run/tls:ro
    networks:
    - tenant-alpha
    depends_on:
      aether-alpha:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  platform-alpha:
    image: ${BACKEND_IMAGE:?Run build.py}
    command:
    - python
    - -m
    - x_ws_server
    environment:
      AETHER_GATEWAY: aether-alpha:50051
      AETHER_AUTH: none
      AETHER_TLS_ENABLED: 'true'
      AETHER_TLS_CA_CERT: /run/tls/ca.crt
      AETHER_TLS_CLIENT_CERT: /run/tls/tls.crt
      AETHER_TLS_CLIENT_KEY: /run/tls/tls.key
      SCITRERA_TENANT: alpha
      LOGGING_LEVEL: INFO
      AETHER_ANON_TLS_CLIENT_CERT: /run/anonymous/tls.crt
      AETHER_ANON_TLS_CLIENT_KEY: /run/anonymous/tls.key
      AETHER_MAX_RECONNECT_ATTEMPTS: '0'
      WS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-18080}}
      SAHARA_IMAGE: ${SAHARA_IMAGE:?Run build.py}
      SAHARA_CODE_SIDECAR_IMAGE: ${CODE_IMAGE:?Run build.py}
      LLM_GATEWAY_AUTH_MODE: bearer
      LLM_GATEWAY_BASE_URL: http://llm-gateway.mt:8080/v1
      LLM_GATEWAY_BEARER_TOKEN_FILE: /run/gateway/token
      SANDBOX_BLOB_FETCH_BASE_URL: http://storage-download:8080
      SANDBOX_BLOB_UPLOAD_BASE_URL: http://storage-download:8080/uploads
      SCITRERA_WORK_PROFILES_FILE: /run/work-profiles.json
    volumes:
    - ../.local/alpha/tls/platform-server:/run/tls:ro
    - ../.local/alpha/tls/anonymous:/run/anonymous:ro
    - ../.local/alpha/gateway-token:/run/gateway/token:ro
    - ${WORK_PROFILES_FILE:-./config/work-profiles.json}:/run/work-profiles.json:ro
    networks:
    - tenant-alpha
    - gateway
    depends_on:
      catalog-alpha:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  aether-beta:
    image: ${AETHER_IMAGE:?Run build.py}
    entrypoint:
    - aetherlite
    command:
    - -config
    - /etc/aether/config.yaml
    - -data-dir
    - /data
    environment:
      AETHER_TENANT_ID: beta
      AETHER_TOKEN_HMAC_KEY: ${AETHER_HMAC_BETA}
      AETHER_ADMIN_API_KEY: ${AETHER_ADMIN_BETA}
      AETHERLITE_AUTH_VERIFY_LISTEN: :8082
    volumes:
    - aether-beta:/data
    - ../.local/beta/aether.yaml:/etc/aether/config.yaml:ro
    - ../.local/beta/tls/server:/etc/aether/tls:ro
    networks:
      tenant-beta:
        aliases:
        - aether-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    depends_on:
      aether-init-beta:
        condition: service_completed_successfully
  acl-beta:
    image: ${BACKEND_IMAGE:?Run build.py}
    command:
    - python
    - -m
    - x_acl_seed
    environment:
      AETHER_GATEWAY: aether-beta:50051
      AETHER_AUTH: none
      AETHER_TLS_ENABLED: 'true'
      AETHER_TLS_CA_CERT: /run/tls/ca.crt
      AETHER_TLS_CLIENT_CERT: /run/tls/tls.crt
      AETHER_TLS_CLIENT_KEY: /run/tls/tls.key
      SCITRERA_TENANT: beta
      LOGGING_LEVEL: INFO
      TENANT_ID: beta
      ACL_SEED_PHASE: acl
      MINT_ORCH_IMPL: default
      MINT_ORCH_SPEC: bootstrap
      ACL_TRUSTED_SERVICE_IMPLEMENTATIONS: platform-server,platform-bridge,memorylayer,data-connectors,tool-catalog,sandbox-provider,scitrera-management-plane
      ACL_READ_ONLY_KV_SERVICES: '{"sparkroute-modelcatalog": ["sparkroute/modelcatalog/v1/models/*"]}'
    volumes:
    - ../.local/beta/tls/orchestrator:/run/tls:ro
    networks:
    - tenant-beta
    depends_on:
      aether-beta:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  platform-beta:
    image: ${BACKEND_IMAGE:?Run build.py}
    command:
    - python
    - -m
    - x_ws_server
    environment:
      AETHER_GATEWAY: aether-beta:50051
      AETHER_AUTH: none
      AETHER_TLS_ENABLED: 'true'
      AETHER_TLS_CA_CERT: /run/tls/ca.crt
      AETHER_TLS_CLIENT_CERT: /run/tls/tls.crt
      AETHER_TLS_CLIENT_KEY: /run/tls/tls.key
      SCITRERA_TENANT: beta
      LOGGING_LEVEL: INFO
      AETHER_ANON_TLS_CLIENT_CERT: /run/anonymous/tls.crt
      AETHER_ANON_TLS_CLIENT_KEY: /run/anonymous/tls.key
      AETHER_MAX_RECONNECT_ATTEMPTS: '0'
      WS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-18080}}
      SAHARA_IMAGE: ${SAHARA_IMAGE:?Run build.py}
      SAHARA_CODE_SIDECAR_IMAGE: ${CODE_IMAGE:?Run build.py}
      LLM_GATEWAY_AUTH_MODE: bearer
      LLM_GATEWAY_BASE_URL: http://llm-gateway.mt:8080/v1
      LLM_GATEWAY_BEARER_TOKEN_FILE: /run/gateway/token
      SANDBOX_BLOB_FETCH_BASE_URL: http://storage-download:8080
      SANDBOX_BLOB_UPLOAD_BASE_URL: http://storage-download:8080/uploads
      SCITRERA_WORK_PROFILES_FILE: /run/work-profiles.json
    volumes:
    - ../.local/beta/tls/platform-server:/run/tls:ro
    - ../.local/beta/tls/anonymous:/run/anonymous:ro
    - ../.local/beta/gateway-token:/run/gateway/token:ro
    - ${WORK_PROFILES_FILE:-./config/work-profiles.json}:/run/work-profiles.json:ro
    networks:
    - tenant-beta
    - gateway
    depends_on:
      catalog-beta:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  aether-init-alpha:
    image: ${AETHER_IMAGE:?Run build.py}
    user: 0:0
    entrypoint:
    - sh
    - -c
    command:
    - chown 1000:1000 /data
    volumes:
    - aether-alpha:/data
    network_mode: none
    restart: 'no'
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    labels:
      platform.scitrera.io/lifecycle: job
  aether-init-beta:
    image: ${AETHER_IMAGE:?Run build.py}
    user: 0:0
    entrypoint:
    - sh
    - -c
    command:
    - chown 1000:1000 /data
    volumes:
    - aether-beta:/data
    network_mode: none
    restart: 'no'
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    labels:
      platform.scitrera.io/lifecycle: job
  storage-postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: storage
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: ${STORAGE_PASSWORD}
    volumes:
    - storage-postgres:/var/lib/postgresql/data
    networks:
    - storage
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U storage -d storage
      interval: 3s
      timeout: 3s
      retries: 40
  objects:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command:
    - server
    - /data
    environment:
      MINIO_ROOT_USER: platform-storage
      MINIO_ROOT_PASSWORD: ${OBJECT_PASSWORD}
    volumes:
    - objects:/data
    networks:
    - storage
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9000/minio/health/ready
      interval: 3s
      timeout: 3s
      retries: 40
  objects-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - 'mc alias set local http://objects:9000 "$$OBJECT_USER" "$$OBJECT_PASSWORD"
      >/dev/null

      mc mb --ignore-existing local/tenant-alpha local/tenant-beta local/staging'
    environment:
      OBJECT_USER: platform-storage
      OBJECT_PASSWORD: ${OBJECT_PASSWORD}
    networks:
    - storage
    depends_on:
      objects:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  storage-edge:
    image: ${EDGE_IMAGE:?Run build.py}
    user: ${LOCAL_UID}:${LOCAL_GID}
    command:
    - -addr
    - :8090
    - -backend
    - s3
    - -index
    - postgres
    - -policy
    - postgres
    - -tenant-config
    - /run/storage/tenants.json
    - -tenant-secrets-file
    - /run/storage/credentials.json
    - -staging
    - s3
    - -staging-bucket
    - staging
    - -s3-endpoint
    - http://objects:9000
    - -s3-force-path-style
    - -key-seed-hex
    - ${EDGE_SIGNING_SEED}
    - -default-require-auth
    - -gc-interval
    - '0'
    environment: &id001
      BLOBGW_DATABASE_URL: postgres://storage:${STORAGE_PASSWORD}@storage-postgres:5432/storage?sslmode=disable
      BLOBGW_EDGE_DATABASE_URL: postgres://storage:${STORAGE_PASSWORD}@storage-postgres:5432/storage?sslmode=disable
      AWS_ACCESS_KEY_ID: platform-storage
      AWS_SECRET_ACCESS_KEY: ${OBJECT_PASSWORD}
      AWS_REGION: us-east-1
    volumes: &id002
    - ../.local/storage-tenants.json:/run/storage/tenants.json:ro
    - ../.local/storage-credentials.json:/run/storage/credentials.json:ro
    networks:
    - storage
    - storage-api
    depends_on: &id003
      storage-postgres:
        condition: service_healthy
      objects-init:
        condition: service_completed_successfully
  blobgw:
    image: ${BLOBGW_IMAGE:?Run build.py}
    user: ${LOCAL_UID}:${LOCAL_GID}
    command:
    - -addr
    - :8080
    - -backend
    - s3
    - -index
    - postgres
    - -tenant-config
    - /run/storage/tenants.json
    - -tenant-secrets-file
    - /run/storage/credentials.json
    - -staging
    - s3
    - -s3-endpoint
    - http://objects:9000
    - -s3-bucket
    - staging
    - -s3-force-path-style
    - -gc-interval
    - '0'
    environment: *id001
    volumes: *id002
    networks:
    - storage
    - storage-api
    depends_on: *id003
  ml-postgres-alpha:
    image: ${ML_POSTGRES_IMAGE:?Run build.py}
    environment:
      POSTGRES_DB: memorylayer
      POSTGRES_USER: memorylayer
      POSTGRES_PASSWORD: ${ML_PASSWORD_ALPHA}
    volumes:
    - ml-postgres-alpha:/var/lib/postgresql/data
    networks:
    - tenant-alpha
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U memorylayer -d memorylayer
      interval: 3s
      timeout: 3s
      retries: 40
  dc-postgres-alpha:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: dataconnectors
      POSTGRES_USER: dataconnectors
      POSTGRES_PASSWORD: ${DC_PASSWORD_ALPHA}
    volumes:
    - dc-postgres-alpha:/var/lib/postgresql/data
    networks:
    - tenant-alpha
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dataconnectors -d dataconnectors
      interval: 3s
      timeout: 3s
      retries: 40
  ml-migrate-alpha:
    image: ${MEMORYLAYER_IMAGE:?Run build.py}
    entrypoint:
    - python
    command:
    - /integration/memorylayer_migrate.py
    environment:
      MEMORYLAYER_POSTGRESQL_URL: postgresql://memorylayer:${ML_PASSWORD_ALPHA}@ml-postgres-alpha:5432/memorylayer
      MEMORYLAYER_AUTO_MIGRATE: '1'
      MEMORYLAYER_EMBEDDING_DIMENSIONS: '1536'
    networks:
    - tenant-alpha
    depends_on:
      ml-db-prepare-alpha:
        condition: service_completed_successfully
    restart: 'no'
    volumes:
    - ../scripts:/integration:ro
    labels:
      platform.scitrera.io/lifecycle: job
  memorylayer-alpha:
    image: ${MEMORYLAYER_IMAGE:?Run build.py}
    environment:
      AETHER_GATEWAY: aether-alpha:50051
      AETHER_AUTH: none
      AETHER_TLS_ENABLED: 'true'
      AETHER_TLS_CA_CERT: /run/tls/ca.crt
      AETHER_TLS_CLIENT_CERT: /run/tls/tls.crt
      AETHER_TLS_CLIENT_KEY: /run/tls/tls.key
      SCITRERA_TENANT: alpha
      LOGGING_LEVEL: INFO
      AETHER_MAX_RECONNECT_ATTEMPTS: '0'
      AETHER_GATEWAY_ADDR: aether-alpha:50051
      MEMORYLAYER_SERVER_HOST: 0.0.0.0
      MEMORYLAYER_SERVER_PORT: '8000'
      MEMORYLAYER_STORAGE_BACKEND: postgresql
      MEMORYLAYER_POSTGRESQL_URL: postgresql://memorylayer:${ML_PASSWORD_ALPHA}@ml-postgres-alpha:5432/memorylayer
      MEMORYLAYER_AUTO_MIGRATE: '0'
      MEMORYLAYER_CACHE_SERVICE: aether-kv
      MEMORYLAYER_RATE_LIMIT_SERVICE: aether-kv
      MEMORYLAYER_AUDIT_SERVICE: postgresql
      MEMORYLAYER_AUTHENTICATION_SERVICE: aether
      MEMORYLAYER_AETHER_TERMINATOR_HEADER_MODE: passthrough
      MEMORYLAYER_METRICS_SERVICE: noop
      MEMORYLAYER_TASKS_INPROCESS_WORKER: 'true'
      MEMORYLAYER_EMBEDDING_DIMENSIONS: '1536'
      MEMORYLAYER_EMBED_TRANSPORT: http
      MEMORYLAYER_EMBED_SERVER_URL: ${EMBED_ENDPOINT:?Configure embedding endpoint
        or fixtures}
      MEMORYLAYER_ENTITY_LINKER_PROVIDER: none
      MEMORYLAYER_DOCUMENT_TRANSCRIBE_ENABLED: 'false'
      MEMORYLAYER_CHAT_TITLE_ENABLED: '0'
      MEMORYLAYER_OTEL_ENABLED: 'false'
      MEMORYLAYER_GRAPH_ANALYSIS_PROVIDER: default
      MEMORYLAYER_GRAPH_QUERY_PROVIDER: default
      MEMORYLAYER_RATE_LIMIT_REQUESTS: '10000'
      MEMORYLAYER_DATA_DIR: /home/memorylayer
      MEMORYLAYER_BLOB_STORAGE_BASE_PATH: /home/memorylayer/blobs
      # Canonical page files use direct HTTP storage; Aether carries descriptors.
      MEMORYLAYER_SOURCE_FILES_FETCH_URL: http://storage-download:8080
      MEMORYLAYER_TENANT_ID: alpha
      MEMORYLAYER_LLM_PROFILE_DEFAULT_PROVIDER: openai
      MEMORYLAYER_LLM_PROFILE_DEFAULT_MODEL: memorylayer-default
      MEMORYLAYER_LLM_PROFILE_DEFAULT_BASE_URL: http://gateway:8080/v1
      MEMORYLAYER_LLM_IDENTITY_HEADER_HOSTS: gateway
    networks:
    - tenant-alpha
    - storage-api
    volumes:
    - ../.local/alpha/tls/memorylayer:/run/tls:ro
    - memorylayer-data-alpha:/home/memorylayer
    depends_on:
      ml-migrate-alpha:
        condition: service_completed_successfully
      acl-alpha:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)
      interval: 5s
      timeout: 5s
      retries: 45
      start_period: 15s
    env_file:
    - ../.local/alpha/memorylayer.env
  dc-migrate-alpha:
    image: ${CONNECTORS_IMAGE:?Run build.py}
    entrypoint:
    - python
    - -c
    command:
    - from data_connectors.db.engine import run_migrations; run_migrations()
    environment:
      DC_POSTGRESQL_URL: postgresql://dataconnectors:${DC_PASSWORD_ALPHA}@dc-postgres-alpha:5432/dataconnectors
    networks:
    - tenant-alpha
    depends_on:
      dc-postgres-alpha:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  connectors-alpha:
    image: ${CONNECTORS_IMAGE:?Run build.py}
    environment:
      AETHER_GATEWAY: aether-alpha:50051
