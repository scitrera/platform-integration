    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    entrypoint:
    - psql
    command:
    - -v
    - ON_ERROR_STOP=1
    - -c
    - ALTER ROLE memorylayer SET search_path = public, ag_catalog; ALTER DATABASE
      memorylayer SET search_path = public, ag_catalog;
    environment:
      PGHOST: ml-postgres-beta
      PGUSER: memorylayer
      PGDATABASE: memorylayer
      PGPASSWORD: ${ML_PASSWORD_BETA}
    networks:
    - tenant-beta
    depends_on:
      ml-postgres-beta:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  sparkroute-postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: sparkroute
      POSTGRES_USER: sparkroute
      POSTGRES_PASSWORD: ${SPARKROUTE_PASSWORD}
    volumes:
    - sparkroute-postgres:/var/lib/postgresql/data
    networks:
    - model-state
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sparkroute -d sparkroute
      interval: 3s
      timeout: 3s
      retries: 40
  gateway-migrate:
    image: ${SPARKROUTE_IMAGE:?Supply the platform-sparkroute image}
    command:
    - migrate
    - --components
    - ledger,runtime
    environment:
      SPARKROUTE_POSTGRES_URL: postgres://sparkroute:${SPARKROUTE_PASSWORD}@sparkroute-postgres:5432/sparkroute?sslmode=disable
      SPARKROUTE_RUNTIME_POSTGRES_URL: postgres://sparkroute:${SPARKROUTE_PASSWORD}@sparkroute-postgres:5432/sparkroute?sslmode=disable
    networks:
    - model-state
    depends_on:
      sparkroute-postgres:
        condition: service_healthy
    restart: 'no'
    labels:
      platform.scitrera.io/lifecycle: job
  gateway:
    image: ${SPARKROUTE_IMAGE:?Supply the platform-sparkroute image}
    user: ${LOCAL_UID}:${LOCAL_GID}
    environment:
      SPARKROUTE_CONFIG: /run/gateway/config.json
      SPARKROUTE_DATA_ADDRESS: :8080
      SPARKROUTE_ADMIN_ADDRESS: 127.0.0.1:8081
      SPARKROUTE_OPERATIONS_ADDRESS: 127.0.0.1:9090
      SPARKROUTE_POSTGRES_URL: postgres://sparkroute:${SPARKROUTE_PASSWORD}@sparkroute-postgres:5432/sparkroute?sslmode=disable
      SPARKROUTE_RUNTIME_POSTGRES_URL: postgres://sparkroute:${SPARKROUTE_PASSWORD}@sparkroute-postgres:5432/sparkroute?sslmode=disable
      SPARKROUTE_POSTGRES_AUTO_MIGRATE: 'false'
      SPARKROUTE_RUNTIME_POSTGRES_AUTO_MIGRATE: 'false'
      SPARKROUTE_CALLER_AUTH_MODE: bearer
      SPARKROUTE_CALLER_AUTH_CONFIG_REF: file:///run/gateway/callers.json
      SPARKROUTE_CALLER_AUTH_HEADERS: "{\n  \"tenant\": [\"X-Scitrera-Tenant\"],\n\
        \  \"user\": [\"X-Scitrera-User\"],\n  \"source\": [\"X-Scitrera-Source\"\
        ],\n  \"workspace\": [\"X-Scitrera-Workspace\"],\n  \"thread_id\": [\"X-Scitrera-Thread-Id\"\
        ],\n  \"task_id\": [\"X-Scitrera-Task-Id\"],\n  \"experiment\": [\"X-Scitrera-Experiment\"\
        ],\n  \"session\": [\"X-Scitrera-Session\"],\n  \"mlflow_experiment_id\":\
        \ [\"X-MLflow-Experiment-Id\"]\n}"
      SPARKROUTE_CREDENTIAL_FILE_ROOTS: /run/gateway
      SPARKROUTE_MODEL_CATALOG_KIND: aether
      SPARKROUTE_MODEL_CATALOG_SOURCE_ID: tenant-aether
      SPARKROUTE_MODEL_CATALOG_AETHER_ADDRESS_TEMPLATE: aether-{tenant}:50051
      SPARKROUTE_MODEL_CATALOG_AETHER_SERVER_NAME_TEMPLATE: aether-{tenant}
      SPARKROUTE_MODEL_CATALOG_AETHER_CREDENTIAL_FILE_TEMPLATE: file:///run/gateway/catalog-{tenant}.json
      SPARKROUTE_MODEL_CATALOG_AETHER_REPLICA_ID: compose-gateway
      SPARKROUTE_MODEL_CATALOG_ALLOWED_PROVIDER_HOSTS: ${MODEL_PROVIDER_HOSTS:?Set
        the provider host allowlist}
      SPARKROUTE_MODEL_CATALOG_PROVIDER_ALLOW_HTTP: ${MODEL_PROVIDER_ALLOW_HTTP:-false}
      SPARKROUTE_MODEL_CATALOG_ALLOWED_CREDENTIAL_SCHEMES: file
    volumes:
    - ../.local/gateway:/run/gateway:ro
    networks:
      tenant-alpha:
        aliases:
        - llm-gateway.mt
      tenant-beta:
        aliases:
        - llm-gateway.mt
      model-state: {}
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      models-alpha-sahara-default:
        condition: service_completed_successfully
      models-alpha-sahara-vision-advanced:
        condition: service_completed_successfully
      models-alpha-sahara-text-advanced:
        condition: service_completed_successfully
      models-beta-sahara-default:
        condition: service_completed_successfully
      models-beta-sahara-vision-advanced:
        condition: service_completed_successfully
      models-beta-sahara-text-advanced:
        condition: service_completed_successfully
  skills-alpha:
    image: ${SKILLS_IMAGE:?Run build.py}
    command:
    - python
    - -m
    - x_seed_skills
    environment:
